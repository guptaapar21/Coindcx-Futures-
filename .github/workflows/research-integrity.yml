name: Futures research integrity checks
on:
  push:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r requirements.txt
      - name: Verify repository configuration and isolation
        run: |
          set -euo pipefail
          python - <<'PY'
import json
from pathlib import Path
cfg=json.loads(Path('config.json').read_text())
assert cfg['coindcx']['market_mode']=='FUTURES_ONLY'
assert cfg['research']['market_mode']=='FUTURES_ONLY'
assert len(cfg['coindcx']['futures_symbols']) == 6
assert cfg['research']['windows_seconds'] == [5,15,30,60,180]
assert cfg['research']['forward_horizons_seconds'] == [60,300,600,900,1800]
assert cfg['storage']['raw_artifact_prefix'].startswith('coindcx-futures-raw-')
assert cfg['collector']['default_duration_minutes'] == 30
assert Path('src/futures_collector.py').exists()
assert Path('src/futures_research.py').exists()
assert Path('src/futures_strategy_research.py').exists()
PY
      - name: Verify workflow architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/futures-manual-collector.yml
          ! test -f .github/workflows/continuous-collector.yml
          grep -q '^  workflow_dispatch:' .github/workflows/futures-manual-collector.yml
          grep -q 'continue_chain:' .github/workflows/futures-manual-collector.yml
          grep -q 'duration_minutes:' .github/workflows/futures-manual-collector.yml
          grep -q 'repository_dispatch:' .github/workflows/futures-manual-collector.yml
          grep -q 'futures-manual-collector.yml' .github/workflows/process-batch.yml || true
          ! grep -qE '^\s*schedule:' .github/workflows/futures-manual-collector.yml
          ! find .github/workflows -maxdepth 1 -type f -name '*supervisor*.yml' -print -quit | grep -q .
          ! find .github/workflows -maxdepth 1 -type f -name '*watchdog*.yml' -print -quit | grep -q .
          ! grep -R -q 'overnight-pipeline-watchdog' .github/workflows || true
      - name: Verify latest compact research artifacts
        shell: bash
        run: |
          set -euo pipefail
          for root in data/research/futures_compact_1m data/research/futures_compact_3m; do
            test -d "$root"
          done
      - name: Check Python test suite
        run: python -m unittest discover -s tests -v
