name: Futures 24x7 Supervisor

on:
  # Manual-only diagnostic/recovery supervisor. Continuous monitoring is handled by ChatGPT.
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: coindcx-futures-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify required workflows are active
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for wf in continuous-collector.yml process-batch.yml storage-housekeeping.yml nightly-supervisor.yml; do
            state=$(gh api "repos/$REPO/actions/workflows/$wf" --jq '.state')
            echo "$wf state=$state"
            test "$state" = active
          done

      - name: Recover successful raw batches missing processing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
import json, os, subprocess, time
repo=os.environ['REPO']
def api(path): return json.loads(subprocess.check_output(['gh','api',path], text=True))
now=time.time()
collectors=api(f'repos/{repo}/actions/workflows/continuous-collector.yml/runs?branch=main&per_page=20')['workflow_runs']
processors=api(f'repos/{repo}/actions/workflows/process-batch.yml/runs?branch=main&per_page=100')['workflow_runs']
for r in collectors:
    if r.get('conclusion')!='success': continue
    created=time.mktime(time.strptime(r['created_at'][:19], '%Y-%m-%dT%H:%M:%S'))
    if now-created < 20*60: continue
    arts=api(f"repos/{repo}/actions/runs/{r['id']}/artifacts?per_page=100")['artifacts']
    raws=[a for a in arts if not a.get('expired') and a['name'].startswith('coindcx-futures-raw-')]
    if len(raws)!=1: continue
    raw=raws[0]; batch=raw['name'].replace('coindcx-futures-raw-','',1)
    matches=[p for p in processors if batch in (p.get('display_title') or '') or batch in (p.get('name') or '')]
    if any(p.get('conclusion')=='success' for p in matches) or any(p.get('status') in ('queued','in_progress') for p in matches): continue
    subprocess.run(['gh','workflow','run','process-batch.yml','--repo',repo,'--ref','main','-f',f'batch_id={batch}','-f',f'source_run_id={r["id"]}','-f',f'artifact_id={raw["id"]}'],check=True)
    print(f'RECOVERED_PROCESSOR batch={batch}')
    break
PY

      - name: Recover stale collector
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
import json, os, subprocess, time
repo=os.environ['REPO']
def api(path): return json.loads(subprocess.check_output(['gh','api',path], text=True))
now=time.time()
runs=api(f'repos/{repo}/actions/workflows/continuous-collector.yml/runs?branch=main&per_page=10')['workflow_runs']
active=[r for r in runs if r.get('status') in ('queued','in_progress')]
if active:
    print(f'Collector active: {active[0]["id"]}')
    raise SystemExit(0)
completed=[r for r in runs if r.get('conclusion')=='success']
if not completed:
    subprocess.run(['gh','workflow','run','continuous-collector.yml','--repo',repo,'--ref','main','-f','duration_minutes=30'],check=True)
    raise SystemExit(0)
latest=completed[0]
age=now-time.mktime(time.strptime(latest['created_at'][:19], '%Y-%m-%dT%H:%M:%S'))
if age > 40*60:
    subprocess.run(['gh','workflow','run','continuous-collector.yml','--repo',repo,'--ref','main','-f','duration_minutes=30'],check=True)
    print(f'RECOVERED_COLLECTOR latest_success_age_minutes={age/60:.1f}')
else:
    print(f'Collector cadence healthy: latest success {age/60:.1f} min ago.')
PY

      - name: Build machine-readable overall health report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          python - <<'PY'
import json, os, subprocess, time
from pathlib import Path
repo=os.environ['REPO']
def api(path): return json.loads(subprocess.check_output(['gh','api',path], text=True))
now=time.time()
report={'checked_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),'repository':repo,'market_mode':'FUTURES_ONLY','overall':'PASS','components':{}}
bad=[]
for role,wf,max_age in [('collector','continuous-collector.yml',40*60),('processor','process-batch.yml',70*60),('storage','storage-housekeeping.yml',13*3600)]:
    runs=api(f'repos/{repo}/actions/workflows/{wf}/runs?branch=main&per_page=20')['workflow_runs']
    successful=[r for r in runs if r.get('conclusion')=='success']
    latest=runs[0] if runs else None
    latest_success=successful[0] if successful else None
    info={'workflow':wf,'latest_run_id':latest.get('id') if latest else None,'latest_status':latest.get('status') if latest else None,'latest_conclusion':latest.get('conclusion') if latest else None,'latest_success_run_id':latest_success.get('id') if latest_success else None}
    if latest_success:
        age=now-time.mktime(time.strptime(latest_success['created_at'][:19],'%Y-%m-%dT%H:%M:%S'))
        info['latest_success_age_minutes']=round(age/60,1)
        if age>max_age and not any(r.get('status') in ('queued','in_progress') for r in runs): bad.append(f'{role}: no recent successful run')
    else: bad.append(f'{role}: no successful run recorded')
    if latest and latest.get('conclusion')=='failure': bad.append(f'{role}: latest run failed')
    report['components'][role]=info
if bad: report['overall']='FAIL'
report['failures']=bad
Path('supervisor_health.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
print(json.dumps(report,indent=2))
raise SystemExit(1 if bad else 0)
PY

      - name: Upload supervisor verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-supervisor-verdict-${{ github.run_id }}
          path: supervisor_health.json
          retention-days: 7
          if-no-files-found: warn
