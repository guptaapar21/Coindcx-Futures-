name: Futures Nightly Supervisor

on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '0 0 * * *'
    - cron: '30 1 * * *'
    - cron: '0 3 * * *'
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: coindcx-futures-nightly-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required workflows are active
        env: {GH_TOKEN: ${{ github.token }}, REPO: ${{ github.repository }}}
        run: |
          set -euo pipefail
          for wf in continuous-collector.yml process-batch.yml storage-housekeeping.yml nightly-supervisor.yml; do
            state=$(gh api "repos/$REPO/actions/workflows/$wf" --jq '.state')
            echo "$wf state=$state"
            test "$state" = active
          done
      - name: Recover successful raw batches missing processing
        env: {GH_TOKEN: ${{ github.token }}, REPO: ${{ github.repository }}}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['REPO']
          def api(path): return json.loads(subprocess.check_output(['gh','api',path], text=True))
          collectors=api(f'repos/{repo}/actions/workflows/continuous-collector.yml/runs?branch=main&per_page=20')['workflow_runs']
          processors=api(f'repos/{repo}/actions/workflows/process-batch.yml/runs?branch=main&per_page=100')['workflow_runs']
          for r in collectors:
              if r.get('conclusion')!='success': continue
              arts=api(f"repos/{repo}/actions/runs/{r['id']}/artifacts?per_page=100")['artifacts']
              raws=[a for a in arts if not a.get('expired') and a['name'].startswith('coindcx-futures-raw-')]
              if len(raws)!=1: continue
              raw=raws[0]; batch=raw['name'].replace('coindcx-futures-raw-','',1)
              matches=[p for p in processors if batch in (p.get('display_title') or '') or batch in (p.get('name') or '')]
              if any(p.get('conclusion')=='success' for p in matches) or any(p.get('status') in ('queued','in_progress') for p in matches): continue
              print(f'RECOVER batch={batch} source={r["id"]} artifact={raw["id"]}')
              subprocess.run(['gh','workflow','run','process-batch.yml','--repo',repo,'--ref','main','-f',f'batch_id={batch}','-f',f'source_run_id={r["id"]}','-f',f'artifact_id={raw["id"]}'],check=True)
          PY
      - name: End-to-end health gate
        env: {GH_TOKEN: ${{ github.token }}, REPO: ${{ github.repository }}}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys, time
          repo=os.environ['REPO']
          def api(path): return json.loads(subprocess.check_output(['gh','api',path], text=True))
          sets={w:api(f'repos/{repo}/actions/workflows/{w}/runs?branch=main&per_page=20')['workflow_runs'] for w in ['continuous-collector.yml','process-batch.yml','storage-housekeeping.yml']}
          now=time.time(); bad=[]
          def recent(r): return now-time.mktime(time.strptime(r['created_at'][:19],'%Y-%m-%dT%H:%M:%S'))<10*3600
          if not any(recent(r) for r in sets['continuous-collector.yml']): bad.append('no collector run in 10h')
          if not any(recent(r) for r in sets['process-batch.yml']): bad.append('no processor run in 10h')
          if any(recent(r) and r.get('conclusion')=='failure' for r in sets['continuous-collector.yml']): bad.append('collector failure in 10h')
          if any(recent(r) and r.get('conclusion')=='failure' for r in sets['process-batch.yml']): bad.append('processor failure in 10h')
          if bad:
              print('FINAL HEALTH FAIL'); print(*bad,sep='\n- '); sys.exit(1)
          print('FINAL HEALTH PASS')
          PY
