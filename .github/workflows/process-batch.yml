name: CoinDCX Futures batch processing

on:
  repository_dispatch:
    types:
      - coindcx-process-batch

permissions:
  contents: write
  actions: write

concurrency:
  group: futures-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download exact raw Futures batch artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          BATCH_ID: ${{ github.event.client_payload.batch_id }}
          ARTIFACT_ID: ${{ github.event.client_payload.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID"
          test -n "$BATCH_ID"
          test -n "$ARTIFACT_ID"
          echo "PROCESS_SOURCE batch=$BATCH_ID source_run=$SOURCE_RUN_ID artifact=$ARTIFACT_ID"

          mkdir -p "runtime/${BATCH_ID}"
          downloaded=false
          for attempt in 1 2 3 4 5 6 7 8; do
            rm -f /tmp/raw.zip
            if gh api "/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/raw.zip; then
              downloaded=true
              break
            fi
            echo "Raw artifact download attempt ${attempt}/8 failed; waiting 5s..."
            sleep 5
          done

          test "$downloaded" = true
          test -s /tmp/raw.zip
          unzip -q /tmp/raw.zip -d "runtime/${BATCH_ID}"
          test -f "runtime/${BATCH_ID}/manifest.json"
          test -f "runtime/${BATCH_ID}/data_quality.json"

          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('runtime')/os.environ['BATCH_ID']
          m=json.loads((p/'manifest.json').read_text())
          q=json.loads((p/'data_quality.json').read_text())
          assert m.get('market_mode') == 'FUTURES_ONLY'
          assert q.get('market_mode') == 'FUTURES_ONLY'
          required={'futures_trades.jsonl.gz','futures_price_change.jsonl.gz','futures_current_prices.jsonl.gz','futures_depth_snapshot.jsonl.gz'}
          files={x.name for x in p.iterdir()}
          assert required.issubset(files), f'missing Futures raw files: {sorted(required-files)}'
          forbidden={'trades.jsonl.gz','price_change.jsonl.gz','depth_update.jsonl.gz','depth_snapshot.jsonl.gz'}
          assert not (files & forbidden), f'Spot raw files present: {sorted(files & forbidden)}'
          PY

      - name: Build Futures features
        env:
          BATCH_ID: ${{ github.event.client_payload.batch_id }}
        run: python src/futures_research.py --batch "runtime/${BATCH_ID}"

      - name: Validate Futures research grid
        env:
          BATCH_ID: ${{ github.event.client_payload.batch_id }}
        run: |
          python - <<'PY'
          import csv,gzip,os,sys
          from pathlib import Path
          expected={'B-BTC_USDT','B-ETH_USDT','B-SOL_USDT','B-SUI_USDT','B-XRP_USDT','B-DOGE_USDT'}
          p=Path('runtime')/os.environ['BATCH_ID']/'features_1s.csv.gz'
          with gzip.open(p,'rt',encoding='utf-8',newline='') as f: rs=list(csv.DictReader(f))
          for s in expected:
              x=sorted(int(r['epoch_second']) for r in rs if r['symbol']==s)
              if not x or x!=list(range(x[0],x[-1]+1)): sys.exit(f'non-contiguous 1s grid for {s}')
              if not any(r.get('futures_book_valid')=='True' for r in rs if r['symbol']==s): sys.exit(f'no valid book for {s}')
          if {r['symbol'] for r in rs} != expected: sys.exit('symbol set mismatch')
          PY

      - name: Run Futures strategy research
        env:
          BATCH_ID: ${{ github.event.client_payload.batch_id }}
        run: python src/futures_strategy_research.py --input "runtime/${BATCH_ID}/features_1s.csv.gz" --capital 50000 --round-trip-bps 11.8 --out "runtime/${BATCH_ID}/futures_hypotheses.json"

      - name: Merge isolated Futures compact history
        env:
          BATCH_ID: ${{ github.event.client_payload.batch_id }}
        run: python tools/merge_compact.py --batch "runtime/${BATCH_ID}" --dest-root "data/research/futures_compact_1m" --dest-root-3m "data/research/futures_compact_3m"

      - name: Commit isolated Futures research state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name advisorx-bot
          git config user.email advisorx-bot@users.noreply.github.com
          git add data/research/futures_compact_1m data/research/futures_compact_3m data/state/protected_batches.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Futures compact research"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Compact-state push attempt ${attempt}/3 failed; retrying..."
              git rebase --abort 2>/dev/null || true
              sleep 2
            done
            test "$pushed" = true
          fi

      - name: Run repository-local storage lifecycle
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/storage_manager.py

      - name: Upload Futures processing outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-futures-processed-${{ github.event.client_payload.batch_id }}
          path: runtime/${{ github.event.client_payload.batch_id }}/
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn

      - name: Upload storage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-futures-storage-report-${{ github.run_id }}
          path: storage_report.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: ignore
