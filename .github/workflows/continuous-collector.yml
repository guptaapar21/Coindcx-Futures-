name: CoinDCX Futures continuous collector
on:
  push:
    paths:
      - "_manual_workflow_trigger.txt"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Batch duration in minutes (5-230)"
        required: false
        default: "120"
        type: string
      continue_chain:
        description: "Continue automatic Futures batch chaining"
        required: false
        default: true
        type: boolean
permissions:
  contents: read
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r requirements.txt
      - id: batch
        shell: bash
        run: echo "batch_id=$(date -u +%Y%m%dT%H%M%SZ)_run_${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - id: duration
        shell: bash
        run: echo "minutes=${{ inputs.duration_minutes || '120' }}" >> "$GITHUB_OUTPUT"
      - name: Collect Futures raw streams
        run: |
          mkdir -p "runtime/${{ steps.batch.outputs.batch_id }}"
          python src/futures_collector.py --duration-minutes "${{ steps.duration.outputs.minutes }}" --out "runtime/${{ steps.batch.outputs.batch_id }}"
      - id: raw_upload
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-futures-raw-${{ steps.batch.outputs.batch_id }}
          path: runtime/${{ steps.batch.outputs.batch_id }}/
          retention-days: 4
          compression-level: 0
          if-no-files-found: error
      # Chain immediately after successful raw capture/upload. Processing is
      # downstream and therefore cannot prevent the next acquisition cycle.
      - name: Trigger next Futures batch
        if: ${{ inputs.continue_chain == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh workflow run continuous-collector.yml --repo "$REPO" --ref main -f duration_minutes=120 -f continue_chain=true
      - name: Trigger Futures processing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          ARTIFACT_ID: ${{ steps.raw_upload.outputs.artifact-id }}
        continue-on-error: true
        run: |
          test -n "$ARTIFACT_ID"
          gh workflow run process-batch.yml --repo "$REPO" --ref main -f batch_id="$BATCH_ID" -f source_run_id="$GITHUB_RUN_ID" -f artifact_id="$ARTIFACT_ID"
