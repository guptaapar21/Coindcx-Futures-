name: Futures Overnight Check 3
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
permissions:
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Health check
        env: {GH_TOKEN: ${{ github.token }}, REPO: ${{ github.repository }}}
        run: python tools/nightly_health.py
