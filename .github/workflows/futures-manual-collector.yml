name: CoinDCX Futures manual continuous collector

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Batch duration in minutes (5-230)"
        required: false
        default: "30"
        type: string
      continue_chain:
        description: "Automatically start the next batch after this one"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - coindcx-next-batch

permissions:
  contents: write
  actions: write

concurrency:
  group: coindcx-futures-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - id: batch
        name: Determine batch ID
        shell: bash
        run: echo "batch_id=$(date -u +%Y%m%dT%H%M%SZ)_run_${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - id: duration
        name: Determine batch duration
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            minutes="${{ github.event.client_payload.duration_minutes || '30' }}"
          else
            minutes="${{ inputs.duration_minutes || '30' }}"
          fi
          python - <<'PY' "$minutes"
import sys
n=int(sys.argv[1])
assert 5 <= n <= 230, f"duration_minutes must be 5..230, got {n}"
PY
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
      - name: Verify code revision
        run: |
          echo "COLLECTOR_COMMIT=${GITHUB_SHA}"
          git rev-parse HEAD
      - name: Collect Futures raw streams
        run: |
          set -euo pipefail
          mkdir -p "runtime/${{ steps.batch.outputs.batch_id }}"
          python src/futures_collector.py --duration-minutes "${{ steps.duration.outputs.minutes }}" --out "runtime/${{ steps.batch.outputs.batch_id }}"
      - name: Verify raw batch
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
        run: |
          set -euo pipefail
          test -f "runtime/$BATCH_ID/manifest.json"
          test -f "runtime/$BATCH_ID/data_quality.json"
          python - <<'PY'
import json, os
from pathlib import Path
p=Path('runtime')/os.environ['BATCH_ID']
m=json.loads((p/'manifest.json').read_text())
q=json.loads((p/'data_quality.json').read_text())
assert m.get('market_mode') == 'FUTURES_ONLY'
assert q.get('market_mode') == 'FUTURES_ONLY'
required={'futures_trades.jsonl.gz','futures_price_change.jsonl.gz','futures_current_prices.jsonl.gz','futures_depth_snapshot.jsonl.gz'}
files={x.name for x in p.iterdir()}
assert required.issubset(files), f'missing Futures raw files: {sorted(required-files)}'
forbidden={'trades.jsonl.gz','price_change.jsonl.gz','depth_update.jsonl.gz','depth_snapshot.jsonl.gz'}
assert not (files & forbidden), f'Spot raw files present: {sorted(files & forbidden)}'
assert all(x.stat().st_size > 0 for x in p.iterdir() if x.is_file()), 'empty raw artifact file detected'
PY
      - id: raw_upload
        name: Upload raw Futures batch
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-futures-raw-${{ steps.batch.outputs.batch_id }}
          path: runtime/${{ steps.batch.outputs.batch_id }}/
          retention-days: 4
          compression-level: 0
          if-no-files-found: error
      - name: Trigger next Futures batch
        if: ${{ steps.raw_upload.outcome == 'success' && (github.event_name == 'repository_dispatch' || inputs.continue_chain == true) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DURATION_MINUTES: ${{ steps.duration.outputs.minutes }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${REPO}/dispatches" \
            -f event_type='coindcx-next-batch' \
            -f client_payload[reason]='raw_batch_finished' \
            -f client_payload[duration_minutes]="${DURATION_MINUTES}"
