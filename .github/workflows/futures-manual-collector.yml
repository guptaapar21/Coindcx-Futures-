name: CoinDCX Futures continuous collector

run-name: "Futures collector | ${{ github.event_name }} | run=${{ github.run_id }}"

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Batch duration in minutes (5-230)"
        required: false
        default: "120"
        type: string
      continue_chain:
        description: "Automatically start the next batch after this one"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - coindcx-next-batch

permissions:
  contents: write
  actions: write

concurrency:
  group: coindcx-futures-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify trigger source before collection
        shell: bash
        run: |
          set -euo pipefail
          echo "EVENT_NAME=${{ github.event_name }}"
          echo "REF=${GITHUB_REF}"
          echo "SHA=${GITHUB_SHA}"
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "ACTOR=${GITHUB_ACTOR}"
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "DURATION_INPUT=${{ inputs.duration_minutes }}"
              echo "CONTINUE_CHAIN=${{ inputs.continue_chain }}"
              ;;
            repository_dispatch)
              echo "REPOSITORY_DISPATCH_ACTION=${{ github.event.action }}"
              echo "CHAIN_REASON=${{ github.event.client_payload.reason || 'unspecified' }}"
              echo "CHAIN_DURATION=${{ github.event.client_payload.duration_minutes || '120' }}"
              ;;
            schedule)
              echo "SCHEDULED_RUN=true"
              ;;
            *)
              echo "UNEXPECTED_EVENT=${{ github.event_name }}"
              exit 1
              ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Determine batch ID
        id: batch
        shell: bash
        run: |
          BATCH_ID="$(date -u +%Y%m%dT%H%M%SZ)_run_${GITHUB_RUN_ID}"
          echo "batch_id=${BATCH_ID}" >> "$GITHUB_OUTPUT"

      - name: Determine batch duration
        id: duration
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            minutes="${{ github.event.client_payload.duration_minutes || '120' }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            minutes="${{ inputs.duration_minutes || '120' }}"
          else
            minutes="120"
          fi
          python - <<'PY' "$minutes"
import sys
n=int(sys.argv[1])
assert 5 <= n <= 230, f"duration_minutes must be 5..230, got {n}"
PY
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Verify code revision
        run: |
          echo "COLLECTOR_COMMIT=${GITHUB_SHA}"
          git rev-parse HEAD

      - name: Collect Futures raw streams
        run: |
          set -euo pipefail
          mkdir -p "runtime/${{ steps.batch.outputs.batch_id }}"
          python src/futures_collector.py \
            --duration-minutes "${{ steps.duration.outputs.minutes }}" \
            --out "runtime/${{ steps.batch.outputs.batch_id }}"

      - name: Mark raw collection complete
        id: raw_complete
        if: success()
        shell: bash
        run: echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Verify raw batch
        if: ${{ steps.raw_complete.outputs.complete == 'true' }}
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
        run: |
          set -euo pipefail
          test -f "runtime/$BATCH_ID/manifest.json"
          test -f "runtime/$BATCH_ID/data_quality.json"
          python - <<'PY'
import json, os
from pathlib import Path
p=Path('runtime')/os.environ['BATCH_ID']
m=json.loads((p/'manifest.json').read_text())
q=json.loads((p/'data_quality.json').read_text())
assert m.get('market_mode') == 'FUTURES_ONLY'
assert q.get('market_mode') == 'FUTURES_ONLY'
required={'futures_trades.jsonl.gz','futures_price_change.jsonl.gz','futures_current_prices.jsonl.gz','futures_depth_snapshot.jsonl.gz'}
files={x.name for x in p.iterdir()}
missing=required-files
assert not missing, f'missing Futures raw files: {sorted(missing)}'
forbidden={'trades.jsonl.gz','price_change.jsonl.gz','depth_update.jsonl.gz','depth_snapshot.jsonl.gz'}
assert not (files & forbidden), f'Spot raw files present: {sorted(files & forbidden)}'
assert all(x.stat().st_size > 0 for x in p.iterdir() if x.is_file()), 'empty raw artifact file detected'
PY

      - id: raw_upload
        name: Upload raw Futures batch
        if: ${{ steps.raw_complete.outputs.complete == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-futures-raw-${{ steps.batch.outputs.batch_id }}
          path: runtime/${{ steps.batch.outputs.batch_id }}/
          retention-days: 4
          compression-level: 0
          if-no-files-found: error

      - name: Trigger next Futures batch
        if: ${{ steps.raw_upload.outcome == 'success' && (github.event_name == 'repository_dispatch' || inputs.continue_chain == true) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DURATION_MINUTES: ${{ steps.duration.outputs.minutes }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${REPO}/dispatches" \
            -f event_type='coindcx-next-batch' \
            -f client_payload[reason]='raw_batch_finished' \
            -f client_payload[duration_minutes]="${DURATION_MINUTES}"

      - name: Trigger Futures batch processing
        if: ${{ steps.raw_upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.raw_upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${REPO}/dispatches" \
            -f event_type='coindcx-process-batch' \
            -f client_payload[batch_id]="${BATCH_ID}" \
            -f client_payload[source_run_id]="${SOURCE_RUN_ID}" \
            -f client_payload[artifact_id]="${ARTIFACT_ID}"

      - name: Emit collection summary
        if: ${{ steps.raw_upload.outcome == 'success' }}
        run: |
          echo "COLLECTOR_OK batch=${{ steps.batch.outputs.batch_id }} artifact=${{ steps.raw_upload.outputs.artifact-id }} run=${GITHUB_RUN_ID}"
